<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{admin/layout/adminLayout}">

<head>
    <title>Chỉnh sửa profile</title>
</head>

<body>
    <section layout:fragment="content">
        <div class="container-fluid">
            <h1 class="h3 mb-2 text-gray-800">Đổi mật khẫu</h1>
            <div class="card shadow mb-4">
                <div class="card-body">
                    <form th:action="@{/change-password}" method="post" class="needs-validation" th:object="${employee}"
                        novalidate id="changePasswordForm">
                        <div class="form-group ">
                            <label>*Mật khẫu cũ</label>
                            <input type="password" class="form-control" th:field="*{oldPassword}" id="password">
                            <div th:if="${#fields.hasErrors('oldPassword')}" th:errors="*{oldPassword}"
                                class="text-danger"></div>
                            <span class="form-message"></span>
                        </div>
                        <div class="form-group">
                            <label>*Mật khẫu mới</label>
                            <input type="password" class="form-control" th:field="*{newPassword}" id="newPassword">
                            <div th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"
                                class="text-danger"></div>
                            <span class="form-message"></span>
                        </div>
                        <div class="form-group">
                            <label>*Nhập lại mật khẫu</label>
                            <input type="password" class="form-control" th:field="*{repeatPassword}"
                                id="comfirmPassword">
                            <div th:if="${#fields.hasErrors('repeatPassword')}" th:errors="*{repeatPassword}"
                                class="text-danger"></div>
                            <span class="form-message"></span>
                        </div>
                        <a th:href="@{/admin}" class="btn btn-secondary ">Trở về</a>
                        <button type="submit" class="btn btn-success ml-2">Lưu</button>
                    </form>
                </div>
            </div>
        </div>
        <script th:src="@{/assets/js/validations/validator.js}"></script>
        <script>
            Validator({
                form: '#changePasswordForm',
                errorSelector: '.form-message',
                rules: [
                    Validator.isRequired('#password'),
                    Validator.checkLength('#password'),
                    Validator.isRequired('#newPassword'),
                    Validator.checkLength('#newPassword'),
                    Validator.isRequired('#comfirmPassword'),
                    Validator.isComfirmPassword('#comfirmPassword', function () {
                        return document.querySelector('#changePasswordForm #newPassword').value;
                    })
                ]
            });
        </script>
    </section>
</body>

</html>
