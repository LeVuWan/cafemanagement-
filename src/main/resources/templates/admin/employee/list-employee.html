<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{admin/layout/adminLayout}">

<head>
    <title>Quản lý nhân viên</title>
</head>
<style>
    .responsive-text {
        font-size: 1rem;
    }

    @media (max-width: 575.98px) {

        /* XS - Mobile */
        .responsive-text {
            font-size: 0.85rem;
            /* nhỏ hơn trên điện thoại */
        }
    }
</style>

<body>
    <section layout:fragment="content">
        <div class="container-fluid ">
            <!-- DataTales Example -->
            <div class="card shadow mb-4">
                <div class="card-header py-3">
                    <h6 class="m-0 font-weight-bold text-primary">Danh sách nhân viên</h6>
                </div>
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center flex-wrap p-0 mb-2">

                        <div class="mb-2 mb-md-0 text-center text-md-left p-0" sec:authorize="hasRole('MANAGER')">
                            <a th:href="@{/admin/employee/create}" class="btn btn-primary btn-sm">
                                <i class="fas fa-plus mr-1"></i>
                                Thêm mới
                            </a>
                        </div>

                        <div class="col-md-5 col-sm-6 mb-2 mb-md-0 p-0">
                            <form th:action="@{/admin/employee}" method="get">
                                <div class="input-group">
                                    <input type="text" name="keyword" th:value="${keyword}"
                                        class="form-control form-control-sm mr-2"
                                        placeholder="Nhập từ khóa tìm kiếm...">
                                    <div class="input-group-append">
                                        <button class="btn btn-primary btn-sm rounded-sm" type="submit">
                                            <i class="fas fa-search"></i>
                                            Tìm kiếm
                                        </button>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>

                    <div class="table-responsive">
                        <table class="table table-striped table-bordered table-sm align-middle" id="dataTable"
                            width="100%" cellspacing="0">
                            <thead>
                                <tr>
                                    <th>Họ tên</th>
                                    <th>Chức vụ</th>
                                    <th>Lương</th>

                                    <th class="text-center" style="width: 150px;">
                                        Action</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="employee : ${employeis}">
                                    <td class="responsive-text" th:text="${employee.fullname}"></td>
                                    <td class="responsive-text" th:text="${employee.permission.name}"></td>
                                    <td class="responsive-text"
                                        th:text="${#numbers.formatDecimal(employee.salary, 0, 'COMMA', 0, 'POINT')} + 'vn₫'">
                                    </td>
                                    <td class="text-center">
                                        <div class="d-flex flex-wrap justify-content-center">
                                            <a th:href="@{/admin/employee/edit/{id}(id=${employee.employeeId})}"
                                                href="#" class="btn btn-success btn-sm mr-2 my-1">Cập nhật</a>

                                            <button class="btn btn-danger btn-sm my-1"
                                                th:if="${employee.employeeId} != ${#authentication.principal.employyeeId}"
                                                data-toggle="modal"
                                                th:data-target="'#modalDelete_' + ${employee.employeeId}">
                                                Xóa
                                            </button>

                                            <button class="btn btn-danger btn-sm my-1"
                                                th:if="${employee.employeeId} == ${#authentication.principal.employyeeId}"
                                                data-toggle="modal" data-target="#exampleModal">
                                                Xóa
                                            </button>

                                            <div class="modal fade" th:id="'modalDelete_' + ${employee.employeeId}"
                                                tabindex="-1" role="dialog" aria-labelledby="modalDeleteLabel_"
                                                th:aria-labelledby="'modalDeleteLabel_' + ${employee.employeeId}"
                                                aria-hidden="true">
                                                <div class="modal-dialog" role="document">
                                                    <div class="modal-content">
                                                        <div class="modal-header">
                                                            <h5 class="modal-title"
                                                                th:id="'modalDeleteLabel_' + ${employee.employeeId}">Xác
                                                                nhận Xóa nhân viên</h5>
                                                            <button type="button" class="close" data-dismiss="modal"
                                                                aria-label="Close">
                                                                <span aria-hidden="true">&times;</span>
                                                            </button>
                                                        </div>
                                                        <div class="modal-body">
                                                            Bạn có chắc chắn muốn xóa nhân viên có tên <span
                                                                th:text="${employee.fullname}"></span> không?
                                                        </div>
                                                        <div class="modal-footer">
                                                            <button type="button" class="btn btn-secondary"
                                                                data-dismiss="modal">Hủy</button>

                                                            <a th:href="@{/admin/employee/delete/{id}(id=${employee.employeeId})}"
                                                                class="btn btn-danger">Xóa</a>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>

                                            <div class="modal fade" id="exampleModal" tabindex="-1"
                                                aria-labelledby="exampleModalLabel" aria-hidden="true">
                                                <div class="modal-dialog">
                                                    <div class="modal-content">
                                                        <div class="modal-header">
                                                            <button type="button" class="close" data-dismiss="modal"
                                                                aria-label="Close">
                                                                <span aria-hidden="true">&times;</span>
                                                            </button>
                                                        </div>
                                                        <div class="modal-body">
                                                            Bạn không được xóa chính mình
                                                        </div>
                                                        <div class="modal-footer">
                                                            <button type="button" class="btn btn-secondary"
                                                                data-dismiss="modal">Close</button>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>

                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>

                    </div>
                </div>
            </div>
        </div>
    </section>
</body>

</html>
