<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{admin/layout/adminLayout}">

<head>
    <title>Thêm mới thiết bị</title>
</head>

<body>
    <section layout:fragment="content">
        <div class="container-fluid">
            <div class="card shadow mb-4">
                <div class="card-header py-3">
                    <h6 class="m-0 font-weight-bold text-primary">Xuất hàng hóa</h6>
                </div>
                <div class="card-body">

                    <div th:if="${errorMessage}" class="alert alert-danger" role="alert">
                        <span th:text="${errorMessage}"></span>
                    </div>

                    <div th:if="${successMessage}" class="alert alert-success" role="alert">
                        <span th:text="${successMessage}"></span>
                    </div>

                    <form action="/admin/product/export" method="post" th:object="${exportProduct}"
                        class="needs-validation" novalidate id="exportProductForm">
                        <input type="hidden" th:field="*{productId}" />

                        <div class="form-group col-md-6">
                            <label>Hàng hóa</label>
                            <input type="text" class="form-control" th:value="${product.productName}" readonly>
                        </div>

                        <div class="form-group col-md-6">
                            <label>*Ngày xuất</label>
                            <input type="date" class="form-control" th:field="*{exportDate}" id="purchaseDate">
                            <span th:if="${#fields.hasErrors('exportDate')}" th:errors="*{exportDate}"
                                class="text-danger small"></span>
                            <span class="form-message"></span>
                        </div>

                        <div class="form-group col-md-6">
                            <label>*Số lượng</label>
                            <input type="text" class="form-control " th:field="*{quantity}" id="quantity" pattern="\d*"
                                maxlength="5">
                            <span th:if="${#fields.hasErrors('quantity')}" th:errors="*{quantity}"
                                class="text-danger small"></span>
                            <span class="form-message"></span>
                        </div>

                        <a th:href="@{/admin/product}" class="btn btn-secondary">Trở về</a>
                        <button type="submit" class="btn btn-success mr-2">Lưu</button>
                    </form>

                </div>

            </div>
        </div>

        <script th:src="@{/assets/js/validations/validator.js}"></script>
        <script>
            Validator({
                form: '#exportProductForm',
                errorSelector: '.form-message',
                rules: [
                    Validator.isRequired('#quantity'),
                    Validator.checkGreaterThanZero('#quantity', 'Số lượng phải lớn hơn không'),
                    Validator.isRequired('#purchaseDate'),
                ]
            });
        </script>
    </section>
</body>

</html>
