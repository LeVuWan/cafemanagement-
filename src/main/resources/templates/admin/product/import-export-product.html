<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{admin/layout/adminLayout}">

<head>
    <title>Quản lý nhân viên</title>
</head>

<body>
    <section layout:fragment="content">
        <div class="container-fluid">

            <!-- DataTales Example -->
            <div class="card shadow mb-4">
                <div class="card-header py-3">
                    <h6 class="m-0 font-weight-bold text-primary">Danh sách hàng hóa</h6>
                </div>
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center flex-wrap p-0 mb-2">

                        <div class="col-md-5 col-sm-6 mb-2 mb-md-0 p-0">
                            <form th:action="@{/admin/product/history-import-export}" method="get">
                                <div class="input-group">
                                    <input type="text" name="keyword" th:value="${keyword}"
                                        class="form-control form-control-sm mr-2"
                                        placeholder="Tìm kiếm lịch sữ nhập xuất theo tên hàng hóa">
                                    <div class="input-group-append">
                                        <button class="btn btn-primary btn-sm rounded-sm" type="submit">
                                            <i class="fas fa-search"></i>
                                            Tìm kiếm
                                        </button>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>

                    <div class="table-responsive">
                        <table class="table table-bordered table-sm align-middle" id="dataTable" width="100%"
                            cellspacing="0">
                            <thead>
                                <tr>
                                    <th>Tên hàng hóa</th>
                                    <th>Ngày nhập</th>
                                    <th>Ngày xuất</th>
                                    <th class="text-right">Số lượng</th>
                                    <th>Đơn vị</th>
                                    <th class="text-right">Tổng tiền</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="history : ${histories}">
                                    <td th:text="${history.nameProduct}"></td>
                                    <td th:text="${#temporals.format(history.importDate, 'dd-MM-yyyy')}"></td>
                                    <td th:text="${#temporals.format(history.exportDate, 'dd-MM-yyyy')}"></td>
                                    <td class="text-right" th:text="${history.quantity}"></td>
                                    <td th:text="${history.unit}"></td>
                                    <td class="text-right"
                                        th:text="${#numbers.formatDecimal(history.toltalPrice, 0, 'POINT', 0, 'NONE')} + ' ₫'">
                                    </td>
                                </tr>
                            </tbody>
                        </table>

                    </div>
                </div>
            </div>
            <a th:href="@{/admin/product}" class="btn btn-secondary ">Trở về</a>
        </div>
    </section>
</body>

</html>
