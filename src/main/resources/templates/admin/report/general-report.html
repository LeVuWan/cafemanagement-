<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{admin/layout/adminLayout}">

<head>
    <title>Dashboard</title>
</head>

<body>
    <section layout:fragment="content">
        <div class="container bg-white p-4 rounded shadow-sm mb-3">

            <div class="filter-section">
                <h3>Chọn mục</h3>

                <div class="mb-3">
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="category" id="cat-tat-ca" value="general"
                            checked>
                        <label class="form-check-label" for="cat-tat-ca">Danh thu</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="category" id="input-output"
                            value="input-output">
                        <label class="form-check-label" for="cat-nhap-xuat">Nhập-xuất</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="category" id="cat-nhap" value="input">
                        <label class="form-check-label" for="cat-nhap">Nhập</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="category" id="cat-nhap" value="export">
                        <label class="form-check-label" for="cat-nhap">Xuất</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="category" id="cat-ban-hang" value="sell">
                        <label class="form-check-label" for="cat-ban-hang">Bán hàng</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="category" id="cat-tt-nhan-vien"
                            value="employee-info">
                        <label class="form-check-label" for="cat-tt-nhan-vien">TT nhân
                            viên</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="category" id="cat-phi-khac" value="expense">
                        <label class="form-check-label" for="cat-phi-khac">Phí khác</label>
                    </div>
                </div>

                <div id="date">
                    <h3>Chọn khoảng thời gian</h3>
                    <div class="form-row align-items-end mb-3">
                        <div class="col-auto">
                            <div class="form-group">
                                <label for="date-from">*Từ ngày:</label>
                                <input type="date" class="form-control" id="date-from">
                            </div>
                        </div>
                        <div class="col-auto">
                            <div class="form-group">
                                <label for="date-to">*đến ngày:</label>
                                <input type="date" class="form-control" id="date-to">
                            </div>
                        </div>
                    </div>
                </div>

                <button type="submit" id="send-report" class="btn btn-primary">Xem</button>
            </div>


            <hr>
            <table class="table table-bordered table-sm align-middle">
                <thead class="thead-light">
                    <tr>
                        <th>Ngày</th>
                        <th class="text-right">Thu</th>
                        <th class="text-right">Chi</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="report : ${reportData}">
                        <td th:text="${#temporals.format(report.date, 'dd-MM-yyyy')}">Ngày</td>
                        <td class="text-right"
                            th:text="${#numbers.formatDecimal(report.income, 0, 'DEFAULT', 0, 'DEFAULT')}">Thu</td>
                        <td class="text-right"
                            th:text="${#numbers.formatDecimal(report.expense, 0, 'DEFAULT', 0, 'DEFAULT')}">Chi</td>
                    </tr>

                    <tr class="font-weight-bold bg-light" th:if="${!reportData.isEmpty()}">
                        <td>Tổng</td>
                        <td class="text-right"
                            th:text="${#numbers.formatDecimal(totalIncome, 0, 'DEFAULT', 0, 'DEFAULT')}">0</td>
                        <td class="text-right"
                            th:text="${#numbers.formatDecimal(totalExpense, 0, 'DEFAULT', 0, 'DEFAULT')}">0</td>
                    </tr>
                </tbody>
            </table>

        </div>
    </section>
</body>

</html>
