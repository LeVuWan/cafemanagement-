<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:fragment="orderTableModal">
    <div class="modal fade" id="orderTableModal" tabindex="-1" aria-labelledby="orderTableModalLabel"
        aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="orderTableModalLabel">Đặt bàn</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <form id="orderTableForm">
                        <input type="text" id="tableId" style="display: none;" readonly>
                        <div class="form-group">
                            <label for="tableName">Bàn</label>
                            <input type="text" class="form-control" id="tableName" readonly>
                            <span class="form-message"></span>
                        </div>
                        <div class="row">
                            <div class="form-group col-md-6">
                                <label for="customerName">Tên khách hàng</label>
                                <input type="text" class="form-control" id="customerName">
                                <span class="form-message"></span>
                            </div>
                            <div class="form-group col-md-6">
                                <label for="customerPhone">Số điện thoại</label>
                                <input type="text" class="form-control" id="customerPhone">
                                <span class="form-message"></span>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="durationMinutes">Thời gian giữ bàn (phút)</label>
                            <input type="number" class="form-control" id="durationMinutes" min="1" max="30">
                            <span class="form-message"></span>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Hủy</button>
                    <button type="button" class="btn btn-primary" id="btn-confirm-order">Xác nhận đặt bàn</button>
                </div>
            </div>
        </div>
    </div>

</div>
<script th:src="@{/assets/js/validations/validator.js}"></script>
<script>
    Validator({
        form: '#orderTableForm',
        errorSelector: '.form-message',
        rules: [
            Validator.isRequired('#customerName'),
            Validator.isRequired('#customerPhone'),
            Validator.isRequired('#durationMinutes')
        ]
    });
</script>

</html>
