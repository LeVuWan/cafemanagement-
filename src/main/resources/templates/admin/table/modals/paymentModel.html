<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:fragment="paymentModal">
    <div class="modal fade" id="paymentModal" tabindex="-1" aria-labelledby="paymentModalLabel" aria-hidden="true">
        <div class="modal-dialog  ">
            <div class="modal-content payment-modal">
                <div class="modal-header">
                    <h5 class="modal-title" id="paymentModalLabel">Thanh toán bàn </h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">

                    <div class="bill-details">
                        <div class="bill-details__items">
                            <table class="table mb-0 border">
                                <thead>
                                    <tr>
                                        <th class="font-weight-normal text-center">Tên món</th>
                                        <th class="font-weight-normal text-center">SL</th>
                                        <th class="font-weight-normal text-right">Thành tiền</th>
                                    </tr>
                                </thead>
                                <tbody>
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <div class="payment-total d-flex justify-content-center align-items-center my-3">
                        <span class="payment-total__label mr-2">Tổng:</span>
                        <span id="totalPrice" class="payment-total__amount"></span>
                    </div>
                    <form action="" novalidate id="paymentForm">

                        <div class="form-group mb-3">
                            <label for="customer-paid" class="form-label mb-1">Khách đưa:</label>

                            <input type="number" class="form-control " id="customer-paid">

                            <span class="form-message text-danger" style="font-size: 13px;"></span>
                        </div>

                        <div class="form-group mb-3">
                            <label class="form-label mb-1">Thối lại:</label>

                            <span id="change-amount" class="change-amount form-control text-right bg-light">
                                0 đ
                            </span>
                        </div>

                        <div class="form-group mb-3">
                            <label for="chooseVoucher" class="form-label mb-1">Chọn voucher:</label>

                            <select class="custom-select" id="chooseVoucher">
                                <option selected>Chọn voucher</option>
                            </select>

                            <span class="form-message text-danger" style="font-size: 13px;"></span>
                        </div>

                        <div class="form-group mb-3">
                            <button class="btn btn-secondary w-100" id="printBillBtn" type="button">
                                In phiếu thanh toán...
                            </button>
                        </div>

                    </form>

                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Hủy</button>
                    <button type="button" class="btn btn-success" id="comfirmPayment">Thanh toán</button>
                </div>

            </div>
        </div>
        <script th:src="@{/assets/js/validations/validator.js}"></script>
        <script>
            Validator({
                form: '#paymentForm',
                errorSelector: '.form-message',
                rules: [
                    Validator.isRequired('#customer-paid'),
                    Validator.checkChangeAmount('#customer-paid', () => {
                        return Number(
                            document.getElementById("totalPrice").textContent.replace(/\D/g, "")
                        );
                    })
                ]
            });
        </script>
    </div>
</div>

</html>
