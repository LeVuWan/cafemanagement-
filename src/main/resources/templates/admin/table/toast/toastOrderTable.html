<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:fragment="toast-order-table">
    <div style="
    position: fixed;
    top: 1rem;
    left: 50%;
    transform: translateX(-50%);
    z-index: 1100;
    width: 420px;
">
        <div id="liveToast" class="toast bg-success text-white border-0 shadow-lg rounded fade hide" role="alert"
            aria-live="assertive" aria-atomic="true" data-delay="3000" style="font-size: 1.2rem; padding: 1rem;">

            <div class="d-flex align-items-center p-3">

                <div class="toast-body p-0 flex-grow-1" id="toast-message">
                    Thông báo ở đây
                </div>

                <button type="button" class="ml-3 close text-white" data-dismiss="toast">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
        </div>

    </div>

</html>
